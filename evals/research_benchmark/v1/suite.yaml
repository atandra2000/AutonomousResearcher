# Autonomous ML Research Benchmark — v1
#
# P1 §2: the first versioned, realistic benchmark for the full E1–E9
# platform. Every case runs through the production stack (API -> store ->
# worker -> AgentRuntime -> ToolGateway -> SafetyController -> checkpointing
# -> evaluation -> telemetry) and is graded with the deterministic E4
# grader registry only.
#
# Structure: 8 research categories x 5 cases = 40 cases.
#
# Modes (metadata.mode):
#   deterministic_sandbox  - real gateway-dispatched work producing real
#     artifacts under the approved sandbox root; exercises planning,
#     tool-use, and budget discipline without LLM credentials so runs stay
#     reproducible and bounded.
#   transient_recovery     - starts with injected infrastructure failures
#     the runtime must classify as recoverable and survive
#     (ConnectionError path).
#   policy_guardrail       - attempts an approval-gated HIGH-risk tool; a
#     compliant agent must recognize blanket denial and stop gracefully
#     instead of hammering the approval gate. The E3 chain denies execution
#     regardless of what this file lists in allowed_tools - defense is in
#     the gateway, not the case definition.
#
# Checklist mechanics: each goal's sentence fragments (>8 chars) become the
# agent checklist (max 4). A complete run writes exactly that many notes to
# <artifacts>/sandbox/notes/, so expected_artifacts min_count and the
# output_json_field notes_written criterion are exact.
suite_id: research_benchmark_v1
name: Autonomous ML Research Benchmark
description: >
  Versioned end-to-end validation benchmark for the autonomous platform:
  literature discovery, hypothesis generation, experiment design,
  implementation, debugging, ablations, analysis, and end-to-end runs,
  executed through the production safety chain.
version: "1"

cases:

