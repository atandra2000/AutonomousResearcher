    name: Literature survey - transformer KV-cache eviction
    description: Decompose a survey brief into workspace research notes.
    goal: >
      Survey recent transformer KV-cache eviction studies.
      Summarize paged attention memory results.
      Note hybrid attention tradeoffs for long context windows.
    constraints:
      - All writes go through the gateway sandbox root.
      - Complete every checklist part within the step budget.
    allowed_tools: [research_note_write, research_note_list]
    budget: {max_steps: 8, max_tool_calls: 12, max_runtime_seconds: 60}
    timeout_seconds: 90
    tags: [p1_benchmark, literature_discovery]
    revision: r1
    metadata:
      category: literature_discovery
      mode: deterministic_sandbox
      agent_kind: bench_tool
      agent_overrides: {}
      expected_artifacts:
        - {type: research_notes, min_count: 3}
    criteria:
      - {grader: termination, weight: 2.0}
      - {grader: recovery, weight: 2.0}
      - {grader: budget, weight: 1.5}
      - {grader: tool_usage, weight: 1.0}
      - {grader: max_steps, weight: 0.5, config: {max_steps: 8}}
      - {grader: output_json_field, weight: 1.0, required: false,
         config: {field: notes_written, expected: 3}}
      - {grader: output_contains, weight: 1.0, required: false,
         config: {all_of: ["Completed research plan"]}}

