# ---------------------------------------------------------------------------
# Provider-agnostic LLM configuration for the Autonomous ML Research Engineer
# ---------------------------------------------------------------------------
#
# This file is loaded by ``research_engineer.llm.factory.load_config()``.
# Override the path with the ``RE_LLM_CONFIG`` environment variable.
#
# `${VAR}` placeholders are expanded against the process environment, so
# secrets (API keys) never need to be committed.
#
# Switching a provider or model for an agent is a *config-only* change:
# no source edits are required.
#
# Agent-specific model assignments (terminal-first autonomous coding agent):
#   - kimi-k2.7-code  -> coding (CodingAgent, TaskAgent impl phase)
#   - glm-5.2:cloud           -> reasoning (Research/Planner/Literature/Eval)
#   - minimax-m3:cloud        -> orchestration (TaskAgent, ResearchLoopAgent)
# ---------------------------------------------------------------------------

# Provider used when an agent config omits ``provider``.
default_provider: ollama
# Model used when an agent config omits ``model`` (and the provider does
# not declare its own ``default_model``).
default_model: glm-5.2:cloud

# --- Repository memory settings (D4) -------------------------------------
#
# Selects the embedder and vector backend used by Phase 12 repository
# memory. Both options are optional; when omitted, the dependency-free
# HashingEmbedder + InMemoryVectorBackend defaults are used so the system
# works offline and in CI.
#
# embedding:
#   # "hashing" (default, offline) or "sentence_transformer" (semantic).
#   backend: sentence_transformer
#   # Model name (only used when backend == sentence_transformer).
#   model: sentence-transformers/all-MiniLM-L6-v2
# vector_store:
#   # "inmemory" (default, lost on exit) or "chromadb" (persistent).
#   backend: chromadb
#   # Directory for the persistent ChromaDB index (only chromadb).
#   persist_path: ./data/vector_store
#   collection: repository_memory

# --- Provider connection settings ----------------------------------------
providers:
  ollama:
    # Maps to OllamaCloudProvider (see llm/ollama_provider.py).
    type: ollama
    # Ollama Cloud OpenAI-compatible base URL. Override with OLLAMA_BASE_URL.
    base_url: https://ollama.com
    # API key. Leave as ${OLLAMA_API_KEY} so the secret stays out of git.
    api_key: ${OLLAMA_API_KEY}
    # Model used when a request does not specify one.
    default_model: glm-5.2:cloud
    # Per-request HTTP timeout, in seconds.
    timeout: 60

  # --- OpenAI / OpenAI-compatible (see llm/openai_provider.py) ----------
  # Maps to OpenAIProvider. Works with the official OpenAI API (GPT-4o, o1)
  # or any self-hosted gateway that mirrors the OpenAI wire format.
  # openai:
  #   type: openai
  #   base_url: https://api.openai.com
  #   api_key: ${OPENAI_API_KEY}
  #   default_model: gpt-4o
  #   timeout: 60

  # --- Anthropic (see llm/anthropic_provider.py) ------------------------
  # Maps to AnthropicProvider. Native Anthropic Messages API (Claude 3.5/3.7
  # Sonnet, Opus). Note: the Messages API requires an explicit max_tokens;
  # the provider applies a default when a request omits it.
  # anthropic:
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   api_key: ${ANTHROPIC_API_KEY}
  #   default_model: claude-3-5-sonnet-latest
  #   timeout: 60

  # --- Local Ollama (see llm/local_ollama_provider.py) ------------------
  # Maps to LocalOllamaProvider. Points at a locally-running Ollama server
  # (http://localhost:11434). No API key is required by default.
  # local_ollama:
  #   type: local_ollama
  #   base_url: http://localhost:11434
  #   default_model: llama3
  #   timeout: 60

# --- Token pricing (USD per 1M tokens) -----------------------------------
#
# Used by the UsageTracker (see llm/cost.py) to compute USD cost per LLM
# completion. Each entry maps a model id to [prompt_per_1m, completion_per_1m].
# Matching is case-insensitive prefix, so ``gpt-4o-2024-08-06`` resolves to
# the ``gpt-4o`` entry. The built-in fallback table (llm/cost.py) already
# covers the models below; entries here override or extend it.
pricing:
  glm-5.2:cloud: [0.50, 1.50]
  kimi-k2.7-code: [0.60, 2.20]
  minimax-m3:cloud: [0.40, 1.20]
  # OpenAI / OpenAI-compatible
  gpt-4o: [2.50, 10.00]
  gpt-4o-mini: [0.15, 0.60]
  o1: [15.00, 60.00]
  # Anthropic
  claude-3-5-sonnet: [3.00, 15.00]
  claude-3-opus: [15.00, 75.00]
  # Local models are free
  llama3: [0.0, 0.0]

# --- Per-agent model assignments -----------------------------------------
#
# Each entry maps an agent class name to a (provider, model) pair.
# To use a different model for an agent, change the ``model`` value here
# only. Add new providers under ``providers:`` above to mix vendors.
#
# The router resolves a model per agent via research_engineer.llm.router.
agents:
  # --- Reasoning agents (glm-5.2:cloud) ---------------------------------
  ResearchAgent:
    provider: ollama
    model: glm-5.2:cloud
  ExperimentPlannerAgent:
    provider: ollama
    model: glm-5.2:cloud
  LiteratureAgent:
    provider: ollama
    model: glm-5.2:cloud
  EvaluationAgent:
    provider: ollama
    model: glm-5.2:cloud
  MemoryAgent:
    provider: ollama
    model: glm-5.2:cloud
  ArchitectAgent:
    provider: ollama
    model: glm-5.2:cloud
  ReviewerAgent:
    provider: ollama
    model: glm-5.2:cloud
  FailureAnalyzer:
    provider: ollama
    model: glm-5.2:cloud
  RepairStrategist:
    provider: ollama
    model: glm-5.2:cloud

  # --- Phase 15: Research workflow agents (glm-5.2:cloud for reasoning) ---
  LiteratureDiscoveryAgent:
    provider: ollama
    model: glm-5.2:cloud
  KnowledgeSynthesisAgent:
    provider: ollama
    model: glm-5.2:cloud
  HypothesisGeneratorAgent:
    provider: ollama
    model: glm-5.2:cloud
  ResearchExperimentPlannerAgent:
    provider: ollama
    model: glm-5.2:cloud
  ResultAnalyzerAgent:
    provider: ollama
    model: glm-5.2:cloud
  ReportGeneratorAgent:
    provider: ollama
    model: glm-5.2:cloud

  # --- Phase 15: Orchestration (minimax-m3:cloud) ---
  ExperimentExecutorAgent:
    provider: ollama
    model: minimax-m3:cloud
  ResearchOrchestrator:
    provider: ollama
    model: minimax-m3:cloud

  # --- Coding agent (kimi-k2.7-code) ----------------------------
  CodingAgent:
    provider: ollama
    model: kimi-k2.7-code

  # --- Orchestration agents (minimax-m3:cloud) --------------------------
  TaskAgent:
    provider: ollama
    model: minimax-m3:cloud
  ResearchLoopAgent:
    provider: ollama
    model: minimax-m3:cloud
  ExperimentAgent:
    provider: ollama
    model: minimax-m3:cloud
  TestAgent:
    provider: ollama
    model: minimax-m3:cloud

  # --- Repository analysis (rule-based by default; LLM optional) -------
  RepositoryAgent:
    provider: ollama
    model: glm-5.2:cloud