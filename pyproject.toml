[project]
name = "research-engineer"
version = "0.9.0"
description = "Autonomous ML Research Engineer - Analyze papers and generate implementation plans"
license = {text = "MIT"}
authors = [
    {name = "Autonomous ML Research Engineer Team"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "httpx>=0.26.0",
    "pymupdf>=1.23.0",
    "arxiv>=2.0.0",
    "numpy>=2.4.6",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.scripts]
research-engineer = "research_engineer.cli:app"

[project.optional-dependencies]
# E6 - optional OpenTelemetry export (never required at runtime).
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
postgres = [
    # Optional durable checkpointing (RE_LANGGRAPH_CHECKPOINT_DSN) and the
    # E8 PostgreSQL improvement store.
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
# P4 CI stabilization: a single hung test must never stall CI indefinitely.
# Thread method keeps working for tests that run in non-main threads.
timeout = 300
timeout_method = "thread"
markers = [
    "network: test requires live internet (arXiv API); skipped when offline",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "U"]
ignore = ["E501"]
extend-ignore = ["D203", "D212"]

[tool.ruff.lint.isort]
# Pin first-party classification explicitly: without this, ruff infers it from
# what resolves on disk, so scripts importing removed sub-packages (e.g. the
# retired research_engineer.service tier) sort differently on CI vs local.
known-first-party = ["research_engineer"]

[tool.ruff.lint.mccabe]
# Legacy codebase: several core orchestration functions exceed the default
# complexity of 10 (max observed ~20). The gate stays on for *new* code at
# a practical ceiling rather than blocking on structural refactors.
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Halstead/complexity metrics use uppercase mathematical notation (N1, N2, ...)
"src/research_engineer/tools/ast_analyzer.py" = ["N806"]
# Graph statistics use mathematical notation (avgDegree)
"src/research_engineer/tools/knowledge_graph.py" = ["N806"]
# Legacy Generic subclass style; PEP 695 migration is a planned refactor
"src/research_engineer/tools/base.py" = ["UP046"]
"src/research_engineer/tools/base_cache.py" = ["UP046"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_subclass_override = true
strict_equality = true
strict_optional = true
exclude = ["tests"]

[[tool.mypy.overrides]]
# Optional Postgres drivers are imported lazily; their stubs ship with
# the `postgres` extra, not the default dev environment.
module = [
    "psycopg",
    "psycopg.*",
    "langgraph.checkpoint.postgres.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/research_engineer"]
omit = [
    "*/__pycache__/*",
    "*/_.*.py",
    "*__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
